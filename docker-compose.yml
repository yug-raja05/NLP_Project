version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: agrigenius_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrigenius_backend
    ports:
      - "8080:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/AgriGeniusAI
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - model_storage:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrigenius_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  model_storage:
